<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tráfico · Monitor</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #181b22;
            --borde: #272b35;
            --texto: #e6e8ee;
            --suave: #8b92a3;
            --acento: #3b82f6;
            --ok: #22c55e;
            --error: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--texto);
        }
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--borde);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 18px; margin: 0; }
        header a { color: var(--suave); font-size: 14px; text-decoration: none; }
        main {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
        .panel {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 16px;
        }
        .visor { position: relative; }
        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            display: block;
            object-fit: cover;
        }
        /* Aquí se dibujarán después las detecciones de la IA */
        canvas#overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .badge {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--suave); }
        .punto.activo { background: var(--ok); }
        .punto.error { background: var(--error); }
        label { display: block; font-size: 12px; color: var(--suave); margin-bottom: 6px; }
        select, button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--borde);
            background: #0f1115;
            color: var(--texto);
            font-size: 14px;
            margin-bottom: 12px;
        }
        button { cursor: pointer; background: var(--acento); border: none; font-weight: 600; }
        button.sec { background: transparent; border: 1px solid var(--borde); font-weight: 400; }
        button:disabled { opacity: .4; cursor: not-allowed; }
        dl { margin: 0; font-size: 13px; }
        dt { color: var(--suave); margin-top: 10px; }
        dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; }
        #mensaje { font-size: 13px; color: var(--suave); min-height: 18px; }
        #mensaje.error { color: var(--error); }
        #capturas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
        #capturas img { width: 100%; border-radius: 4px; }
        .analisis {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--borde);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .analisis-item { display: flex; flex-direction: column; gap: 2px; }
        .analisis-label { font-size: 11px; color: var(--suave); }
        .analisis-valor { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .analisis-valor.alerta { color: var(--error); }
        .analisis-valor.ok { color: var(--ok); }
        .analisis-sub { font-size: 11px; color: var(--suave); }
        .fila-conteo { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
        .fila-conteo dl { flex: 1; margin: 0; }
        .fila-conteo button { width: auto; margin: 0; padding: 6px 10px; font-size: 12px; }
    </style>
</head>
<body>
<header>
    <h1>🚦 Gestor de Tráfico</h1>
    <a href="/admin/">Administración</a>
</header>

<main>
    <section class="panel">
        <div class="visor">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div class="badge"><span class="punto" id="punto"></span><span id="estadoBadge">Sin señal</span></div>
        </div>
        <p id="mensaje"></p>

        <div id="panelAnalisis" class="analisis">
            <div class="analisis-item">
                <span class="analisis-label">Ritmo actual</span>
                <span class="analisis-valor" id="anRitmo">—</span>
                <span class="analisis-sub">veh/min</span>
            </div>
            <div class="analisis-item">
                <span class="analisis-label">vs. histórico mismo horario</span>
                <span class="analisis-valor" id="anVariacion">—</span>
                <span class="analisis-sub" id="anHistorico">—</span>
            </div>
            <div class="analisis-item">
                <span class="analisis-label">Estado</span>
                <span class="analisis-valor" id="anCongestion">—</span>
                <span class="analisis-sub" id="anHoraPico">—</span>
            </div>
        </div>
    </section>

    <aside class="panel">
        <label for="camaraSistema">Cámara registrada (ubicación)</label>
        <select id="camaraSistema">
            {% for cam in camaras %}
            <option value="{{ cam.id }}">{{ cam.nombre }} — {{ cam.interseccion.nombre }}</option>
            {% empty %}
            <option value="">Sin cámaras registradas (créalas en /admin/)</option>
            {% endfor %}
        </select>

        <label for="selector">Dispositivo de video</label>
        <select id="selector"></select>

        <label for="resolucion">Resolución</label>
        <select id="resolucion">
            <option value="640x480">640 × 480</option>
            <option value="1280x720" selected>1280 × 720 (HD)</option>
            <option value="1920x1080">1920 × 1080 (Full HD)</option>
        </select>

        <button id="btnIniciar">Iniciar cámara</button>
        <button id="btnDetener" class="sec" disabled>Detener</button>
        <button id="btnCaptura" class="sec" disabled>Tomar captura</button>

        <label for="intervaloDeteccion">Detección IA</label>
        <select id="intervaloDeteccion">
            <option value="0">Desactivada</option>
            <option value="50">Cada 50 ms (~20 fps)</option>
            <option value="100">Cada 100 ms (~10 fps)</option>
            <option value="200" selected>Cada 200 ms (~5 fps)</option>
            <option value="500">Cada 500 ms</option>
            <option value="1000">Cada 1 s</option>
        </select>

        <dl>
            <dt>Resolución real</dt><dd id="infoRes">—</dd>
            <dt>FPS</dt><dd id="infoFps">—</dd>
            <dt>Dispositivo</dt><dd id="infoDisp">—</dd>
            <dt>Vehículos en escena</dt><dd id="infoVehiculos">—</dd>
            <dt>Vehículos cruzados (sesión)</dt><dd id="infoCruces">—</dd>
        </dl>
        <button id="btnReiniciarConteo" class="sec">Reiniciar conteo</button>

        <div id="capturas"></div>
    </aside>
</main>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const selector = document.getElementById('selector');
const resolucion = document.getElementById('resolucion');
const btnIniciar = document.getElementById('btnIniciar');
const btnDetener = document.getElementById('btnDetener');
const btnCaptura = document.getElementById('btnCaptura');
const mensaje = document.getElementById('mensaje');
const punto = document.getElementById('punto');
const estadoBadge = document.getElementById('estadoBadge');
const infoRes = document.getElementById('infoRes');
const infoFps = document.getElementById('infoFps');
const infoDisp = document.getElementById('infoDisp');
const infoVehiculos = document.getElementById('infoVehiculos');
const infoCruces = document.getElementById('infoCruces');
const intervaloDeteccion = document.getElementById('intervaloDeteccion');
const camaraSistema = document.getElementById('camaraSistema');
const btnReiniciarConteo = document.getElementById('btnReiniciarConteo');
const anRitmo = document.getElementById('anRitmo');
const anVariacion = document.getElementById('anVariacion');
const anHistorico = document.getElementById('anHistorico');
const anCongestion = document.getElementById('anCongestion');
const anHoraPico = document.getElementById('anHoraPico');

// Posición vertical de la línea virtual de conteo (fracción del alto,
// 0 = arriba, 1 = abajo). Un vehículo se cuenta la primera vez que su
// centro cruza esta línea.
const LINEA_Y_FRAC = 0.5;
let totalCruces = 0;

let stream = null;
let contadorFrames = 0;
let ultimoTick = performance.now();
let rafId = null;

// --- Detección de vehículos con YOLO (backend) ---
const canvasCaptura = document.createElement('canvas'); // buffer oculto para extraer el frame como JPEG
let detectando = false;       // evita mandar un frame nuevo mientras el anterior sigue en el servidor
let timerDeteccion = null;
let ultimasDetecciones = [];

function colorPorClase(clase) {
    const colores = {
        auto: '#3b82f6', camion: '#f59e0b', autobus: '#a855f7',
        moto: '#ef4444', bicicleta: '#22c55e'
    };
    return colores[clase] || '#e6e8ee';
}

// Ancho máximo del frame que se manda a analizar. El video se ve a full
// resolución en pantalla; para YOLO no hace falta: menos píxeles = menos
// bytes que viajar por red y menos trabajo de reescalado en el servidor.
const ANCHO_MAX_DETECCION = 960;

async function enviarFrameADetectar() {
    if (!stream || detectando) return;
    if (!camaraSistema.value) {
        setMensaje('Selecciona una cámara registrada (con ubicación) para poder contar y analizar tráfico.', true);
        return;
    }
    detectando = true;
    const t0 = performance.now();
    try {
        const escala = Math.min(1, ANCHO_MAX_DETECCION / video.videoWidth);
        canvasCaptura.width = Math.round(video.videoWidth * escala);
        canvasCaptura.height = Math.round(video.videoHeight * escala);
        canvasCaptura.getContext('2d').drawImage(video, 0, 0, canvasCaptura.width, canvasCaptura.height);
        const tCaptura = performance.now();

        const blob = await new Promise(res => canvasCaptura.toBlob(res, 'image/jpeg', 0.75));
        if (!blob) return;
        const tBlob = performance.now();

        const formData = new FormData();
        formData.append('frame', blob, 'frame.jpg');
        formData.append('camara_id', camaraSistema.value);
        formData.append('linea_y_frac', LINEA_Y_FRAC);

        const resp = await fetch('/detectar/', { method: 'POST', body: formData });
        const tFetch = performance.now();
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        if (data.error) throw new Error(data.error);

        ultimasDetecciones = data.detecciones || [];
        infoVehiculos.textContent = ultimasDetecciones.length;
        totalCruces = data.total_sesion ?? totalCruces;
        infoCruces.textContent = totalCruces;
        dibujarDetecciones();
        const tFin = performance.now();

        console.log(
            `[cliente] captura=${(tCaptura-t0).toFixed(0)}ms  ` +
            `jpeg=${(tBlob-tCaptura).toFixed(0)}ms  ` +
            `red+servidor=${(tFetch-tBlob).toFixed(0)}ms  ` +
            `dibujo=${(tFin-tFetch).toFixed(0)}ms  ` +
            `TOTAL=${(tFin-t0).toFixed(0)}ms  ` +
            `(peso frame=${(blob.size/1024).toFixed(0)}KB)`
        );
    } catch (err) {
        setMensaje('Error en detección IA: ' + err.message, true);
    } finally {
        detectando = false;
    }
}

function dibujarDetecciones() {
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    // Línea virtual de conteo: referencia visual de dónde se cuenta el cruce.
    const yLinea = overlay.height * LINEA_Y_FRAC;
    ctx.strokeStyle = 'rgba(59,130,246,.6)';
    ctx.setLineDash([8, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, yLinea);
    ctx.lineTo(overlay.width, yLinea);
    ctx.stroke();
    ctx.setLineDash([]);

    // El frame que se analiza puede ir más chico que el overlay (ver
    // ANCHO_MAX_DETECCION), así que reescalamos las cajas de vuelta.
    const factor = canvasCaptura.width ? overlay.width / canvasCaptura.width : 1;
    ultimasDetecciones.forEach(d => {
        const x1 = d.x1 * factor, y1 = d.y1 * factor;
        const x2 = d.x2 * factor, y2 = d.y2 * factor;
        const color = d.cruzo ? '#22c55e' : colorPorClase(d.clase);
        ctx.strokeStyle = color;
        ctx.lineWidth = d.cruzo ? 3 : 2;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

        const etiqueta = `#${d.id} ${d.clase} ${(d.confianza * 100).toFixed(0)}%`;
        ctx.font = '13px system-ui, sans-serif';
        const ancho = ctx.measureText(etiqueta).width + 8;
        ctx.fillStyle = color;
        ctx.fillRect(x1, Math.max(0, y1 - 18), ancho, 18);
        ctx.fillStyle = '#0f1115';
        ctx.fillText(etiqueta, x1 + 4, Math.max(12, y1 - 5));
    });
}

function reiniciarTimerDeteccion() {
    if (timerDeteccion) clearInterval(timerDeteccion);
    timerDeteccion = null;
    const ms = Number(intervaloDeteccion.value);
    if (ms > 0 && stream) {
        timerDeteccion = setInterval(enviarFrameADetectar, ms);
    } else {
        ultimasDetecciones = [];
        infoVehiculos.textContent = '—';
        overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
    }
}

intervaloDeteccion.addEventListener('change', reiniciarTimerDeteccion);

// --- Panel de análisis: se consulta aparte del ciclo de detección,
// cada 15s, porque agrega sobre minutos completos y no tiene sentido
// pedirlo en cada frame. ---
let timerAnalisis = null;

async function actualizarAnalisis() {
    if (!camaraSistema.value) return;
    try {
        const resp = await fetch(`/camaras/${camaraSistema.value}/analisis/`);
        if (!resp.ok) return;
        const a = await resp.json();

        anRitmo.textContent = a.ritmo_por_minuto ?? '—';

        if (a.promedio_historico_mismo_horario) {
            anHistorico.textContent = `hist: ${a.promedio_historico_mismo_horario}/min`;
            const signo = a.variacion_pct >= 0 ? '+' : '';
            anVariacion.textContent = `${signo}${a.variacion_pct}%`;
            anVariacion.className = 'analisis-valor ' + (a.variacion_pct > 20 ? 'alerta' : '');
        } else {
            anHistorico.textContent = 'aún sin histórico suficiente';
            anVariacion.textContent = '—';
            anVariacion.className = 'analisis-valor';
        }

        anCongestion.textContent = a.congestion ? 'Congestión' : 'Fluido';
        anCongestion.className = 'analisis-valor ' + (a.congestion ? 'alerta' : 'ok');
        anHoraPico.textContent = a.hora_pico_hoy
            ? `pico hoy: ${a.hora_pico_hoy.hora}:00 (${a.hora_pico_hoy.vehiculos} veh.)`
            : 'sin datos de hoy aún';
    } catch (err) {
        // El análisis es un extra informativo; si falla no interrumpimos el monitoreo.
        console.warn('No se pudo actualizar el análisis:', err);
    }
}

function reiniciarTimerAnalisis() {
    if (timerAnalisis) clearInterval(timerAnalisis);
    timerAnalisis = setInterval(actualizarAnalisis, 15000);
    actualizarAnalisis();
}

btnReiniciarConteo.addEventListener('click', async () => {
    if (!camaraSistema.value) return;
    try {
        await fetch(`/camaras/${camaraSistema.value}/reiniciar/`, { method: 'POST' });
        totalCruces = 0;
        infoCruces.textContent = '0';
    } catch (err) {
        setMensaje('No se pudo reiniciar el conteo: ' + err.message, true);
    }
});

function setMensaje(txt, esError = false) {
    mensaje.textContent = txt;
    mensaje.className = esError ? 'error' : '';
}

function setEstado(clase, texto) {
    punto.className = 'punto ' + clase;
    estadoBadge.textContent = texto;
}

async function listarCamaras() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setMensaje('Este navegador no soporta acceso a cámara, o la página no está en HTTPS/localhost.', true);
        btnIniciar.disabled = true;
        return;
    }
    try {
        // Permiso previo: sin esto enumerateDevices() no devuelve nombres
        const temp = await navigator.mediaDevices.getUserMedia({ video: true });
        temp.getTracks().forEach(t => t.stop());
    } catch (err) {
        setMensaje(mensajeError(err), true);
        setEstado('error', 'Sin permiso');
        return;
    }
    const dispositivos = await navigator.mediaDevices.enumerateDevices();
    const camaras = dispositivos.filter(d => d.kind === 'videoinput');
    selector.innerHTML = '';
    camaras.forEach((d, i) => {
        const op = document.createElement('option');
        op.value = d.deviceId;
        op.textContent = d.label || `Cámara ${i + 1}`;
        selector.appendChild(op);
    });
    if (!camaras.length) setMensaje('No se detectó ninguna cámara.', true);
}

function mensajeError(err) {
    switch (err.name) {
        case 'NotAllowedError': return 'Permiso denegado. Habilita la cámara en el candado de la barra de direcciones.';
        case 'NotFoundError': return 'No se encontró ninguna cámara conectada.';
        case 'NotReadableError': return 'La cámara está siendo usada por otra aplicación.';
        case 'OverconstrainedError': return 'La cámara no soporta esa resolución. Prueba con otra.';
        default: return 'Error al abrir la cámara: ' + err.message;
    }
}

async function iniciar() {
    detener();
    const [w, h] = resolucion.value.split('x').map(Number);
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                deviceId: selector.value ? { exact: selector.value } : undefined,
                width: { ideal: w },
                height: { ideal: h }
            },
            audio: false
        });
    } catch (err) {
        setMensaje(mensajeError(err), true);
        setEstado('error', 'Error');
        return;
    }
    video.srcObject = stream;
    await video.play();

    const track = stream.getVideoTracks()[0];
    const s = track.getSettings();
    infoRes.textContent = `${s.width} × ${s.height}`;
    infoDisp.textContent = track.label;
    overlay.width = s.width;
    overlay.height = s.height;

    setEstado('activo', 'En vivo');
    setMensaje('');
    btnIniciar.disabled = true;
    btnDetener.disabled = false;
    btnCaptura.disabled = false;

    contadorFrames = 0;
    ultimoTick = performance.now();
    bucleFrames();
    reiniciarTimerDeteccion();
    reiniciarTimerAnalisis();
}

function detener() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (timerDeteccion) clearInterval(timerDeteccion);
    timerDeteccion = null;
    if (timerAnalisis) clearInterval(timerAnalisis);
    timerAnalisis = null;
    ultimasDetecciones = [];
    totalCruces = 0;
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
    video.srcObject = null;
    overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
    setEstado('', 'Sin señal');
    infoRes.textContent = infoFps.textContent = infoDisp.textContent = '—';
    infoVehiculos.textContent = infoCruces.textContent = '—';
    btnIniciar.disabled = false;
    btnDetener.disabled = true;
    btnCaptura.disabled = true;
}

// Bucle por frame: solo cuenta FPS. La detección IA corre aparte (ver
// reiniciarTimerDeteccion) para no acoplar el envío al backend al
// refresco de pantalla.
function bucleFrames() {
    contadorFrames++;
    const ahora = performance.now();
    if (ahora - ultimoTick >= 1000) {
        infoFps.textContent = contadorFrames;
        contadorFrames = 0;
        ultimoTick = ahora;
    }
    rafId = requestAnimationFrame(bucleFrames);
}

function tomarCaptura() {
    const c = document.createElement('canvas');
    c.width = video.videoWidth;
    c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    const img = new Image();
    img.src = c.toDataURL('image/jpeg', 0.9);
    document.getElementById('capturas').prepend(img);
}

btnIniciar.addEventListener('click', iniciar);
btnDetener.addEventListener('click', detener);
btnCaptura.addEventListener('click', tomarCaptura);
window.addEventListener('beforeunload', detener);

listarCamaras();
</script>
</body>
</html>
